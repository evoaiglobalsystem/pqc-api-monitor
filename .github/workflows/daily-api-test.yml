name: Daily PQC Functional Test

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"

  workflow_dispatch:

jobs:
  functional-test:
    runs-on: ubuntu-latest

    steps:
      - name: Run PQC functional self-test
        env:
          PQC_API_KEY: ${{ secrets.PQC_API_KEY }}
        run: |
          set -e

          echo "========================================"
          echo "Running PQC functional self-test"
          echo "========================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 120 \
            -X GET \
            "https://pqcscan.evoaiglobal.ai/api/v1/selftest/functional" \
            -H "X-API-Key: ${PQC_API_KEY}" \
            -H "Accept: application/json")

          echo "HTTP Status: ${HTTP_CODE}"
          echo ""

          echo "Response:"
          cat response.json
          echo ""

          # ----------------------------------------
          # 1. HTTP status
          # ----------------------------------------

          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "❌ API returned HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "✅ HTTP status = 200"

          # ----------------------------------------
          # 2. Validate JSON and functional result
          # ----------------------------------------

          python - <<'PY'
          import json
          import sys

          with open("response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          header = data.get("header", {})
          summary = data.get("summary", {})
          functional = data.get("functional", {})

          result = header.get("result")
          functional_result = functional.get("result")
          failed = functional.get("failed", 0)
          passed = functional.get("passed", 0)
          skipped = functional.get("skipped", 0)

          print("")
          print("========================================")
          print("PQC SELF-TEST VALIDATION")
          print("========================================")
          print(f"Header result       : {result}")
          print(f"Functional result   : {functional_result}")
          print(f"Checks passed       : {passed}")
          print(f"Checks failed       : {failed}")
          print(f"Checks skipped      : {skipped}")
          print("")

          errors = []

          if result != "PASS":
              errors.append(f"header.result = {result}")

          if functional_result != "PASS":
              errors.append(f"functional.result = {functional_result}")

          if failed != 0:
              errors.append(f"functional.failed = {failed}")

          if passed == 0:
              errors.append("No functional checks passed")

          if errors:
              print("❌ PQC FUNCTIONAL TEST FAILED")
              for error in errors:
                  print(f"   - {error}")
              sys.exit(1)

          print("========================================")
          print("✅ PQC FUNCTIONAL TEST PASSED")
          print("========================================")
          PY
