name: Daily PQC Functional Test

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"

  workflow_dispatch:

jobs:
  functional-test:
    runs-on: ubuntu-latest

    steps:
      - name: Run PQC functional self-test
        env:
          PQC_API_KEY: ${{ secrets.PQC_API_KEY }}
        run: |
          set -e

          echo "Running PQC functional self-test..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 120 \
            -X GET \
            "https://pqcscan.evoaiglobal.ai/api/v1/selftest/functional" \
            -H "X-API-Key: ${PQC_API_KEY}" \
            -H "Accept: application/json")

          echo "HTTP Status: ${HTTP_CODE}"

          echo "Response:"
          cat response.json

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "❌ PQC functional self-test FAILED"
            exit 1
          fi

          echo "✅ PQC functional self-test PASSED"
