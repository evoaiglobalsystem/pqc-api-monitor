name: Daily PQC Functional Test

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pqc-daily-test
  cancel-in-progress: false

jobs:
  functional-test:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Run PQC functional self-test
      # ----------------------------------------

      - name: Run PQC functional self-test
        id: pqc_test
        env:
          PQC_API_KEY: ${{ secrets.PQC_API_KEY }}
        run: |
          set +e

          echo "========================================"
          echo "Running PQC functional self-test"
          echo "========================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 120 \
            -X GET \
            "https://pqcscan.evoaiglobal.ai/api/v1/selftest/functional" \
            -H "X-API-Key: ${PQC_API_KEY}" \
            -H "Accept: application/json")

          echo "HTTP Status: ${HTTP_CODE}"
          echo ""

          echo "Response:"
          cat response.json
          echo ""

          # ----------------------------------------
          # Defaults
          # ----------------------------------------

          RESULT="FAIL"
          PASSED=0
          FAILED=0
          SKIPPED=0
          DURATION="0"
          SCORE=""
          KEY_EXCHANGE=""

          # ----------------------------------------
          # Validate JSON response
          # ----------------------------------------

          if [ "${HTTP_CODE}" -eq 200 ]; then

            python - <<'PY' > parsed.txt
          import json

          try:
              with open("response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              header = data.get("header", {})
              functional = data.get("functional", {})

              result = header.get("result", "FAIL")
              functional_result = functional.get("result", "FAIL")

              passed = functional.get("passed", 0)
              failed = functional.get("failed", 0)
              skipped = functional.get("skipped", 0)
              duration = functional.get("duration_seconds", 0)

              score = ""
              key_exchange = ""

              checks = functional.get("checks", [])

              for check in checks:
                  observed = check.get("observed", {})
                  scan_results = observed.get("results", [])

                  if scan_results:
                      first = scan_results[0]

                      if "score" in first:
                          score = first.get("score", "")

                      if "key_exchange" in first:
                          key_exchange = first.get("key_exchange", "")

              if (
                  result == "PASS"
                  and functional_result == "PASS"
                  and failed == 0
                  and passed > 0
              ):
                  overall = "PASS"
              else:
                  overall = "FAIL"

              print(f"RESULT={overall}")
              print(f"PASSED={passed}")
              print(f"FAILED={failed}")
              print(f"SKIPPED={skipped}")
              print(f"DURATION={duration}")
              print(f"SCORE={score}")
              print(f"KEY_EXCHANGE={key_exchange}")

          except Exception as e:
              print("RESULT=FAIL")
              print("PASSED=0")
              print("FAILED=0")
              print("SKIPPED=0")
              print("DURATION=0")
              print("SCORE=")
              print("KEY_EXCHANGE=")
              print(f"PARSE_ERROR={e}")
          PY

            cat parsed.txt

            while IFS='=' read -r key value; do
              case "$key" in
                RESULT) RESULT="$value" ;;
                PASSED) PASSED="$value" ;;
                FAILED) FAILED="$value" ;;
                SKIPPED) SKIPPED="$value" ;;
                DURATION) DURATION="$value" ;;
                SCORE) SCORE="$value" ;;
                KEY_EXCHANGE) KEY_EXCHANGE="$value" ;;
              esac
            done < parsed.txt

          fi

          # ----------------------------------------
          # Create logs directory
          # ----------------------------------------

          mkdir -p logs

          # ----------------------------------------
          # India date/time
          # ----------------------------------------

          TEST_DATE=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          TEST_TIME=$(TZ=Asia/Kolkata date '+%H:%M:%S')

          # ----------------------------------------
          # Save latest full response
          # ----------------------------------------

          cp response.json logs/latest-response.json

          # ----------------------------------------
          # Save dated full response
          # ----------------------------------------

          cp response.json "logs/response-${TEST_DATE}.json"

          # ----------------------------------------
          # Keep only last 3 days of JSON responses
          # ----------------------------------------

          find logs \
            -type f \
            -name 'response-*.json' \
            -mtime +2 \
            -delete

          # ----------------------------------------
          # CSV log
          # ----------------------------------------

          LOG_FILE="logs/daily-log.csv"

          if [ ! -f "${LOG_FILE}" ]; then
            echo "date,time,status,http_status,passed,failed,skipped,duration_seconds,score,key_exchange" > "${LOG_FILE}"
          fi

          echo "${TEST_DATE},${TEST_TIME},${RESULT},${HTTP_CODE},${PASSED},${FAILED},${SKIPPED},${DURATION},${SCORE},${KEY_EXCHANGE}" >> "${LOG_FILE}"

          # ----------------------------------------
          # Console summary
          # ----------------------------------------

          echo ""
          echo "========================================"
          echo "PQC TEST SUMMARY"
          echo "========================================"
          echo "Date:          ${TEST_DATE}"
          echo "Time:          ${TEST_TIME} IST"
          echo "Status:        ${RESULT}"
          echo "HTTP:          ${HTTP_CODE}"
          echo "Passed:        ${PASSED}"
          echo "Failed:        ${FAILED}"
          echo "Skipped:       ${SKIPPED}"
          echo "Duration:      ${DURATION} sec"
          echo "PQC Score:     ${SCORE}"
          echo "Key Exchange:  ${KEY_EXCHANGE}"
          echo "========================================"

          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"

          # ----------------------------------------
          # GitHub Actions summary
          # ----------------------------------------

          {
            echo "## PQC Functional Test"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Status | **${RESULT}** |"
            echo "| HTTP | ${HTTP_CODE} |"
            echo "| Passed | ${PASSED} |"
            echo "| Failed | ${FAILED} |"
            echo "| Skipped | ${SKIPPED} |"
            echo "| Duration | ${DURATION} sec |"
            echo "| PQC Score | ${SCORE} |"
            echo "| Key Exchange | ${KEY_EXCHANGE} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # ----------------------------------------
          # Fail workflow if test failed
          # ----------------------------------------

          if [ "${RESULT}" != "PASS" ]; then
            echo "❌ PQC FUNCTIONAL TEST FAILED"
            exit 1
          fi

          echo "✅ PQC FUNCTIONAL TEST PASSED"

      # ----------------------------------------
      # Commit logs even if test failed
      # ----------------------------------------

      - name: Commit test logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/daily-log.csv
          git add logs/latest-response.json
          git add logs/response-*.json

          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi

          git commit -m "chore: update PQC test logs"

          git push
